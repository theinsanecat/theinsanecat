      // Instantly redirects any unknown URL path (e.g. /theinsanecat/ff) back to the home page URL

        var l = window.location;
        var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/theinsanecat/';
        l.replace(target);
      })();
