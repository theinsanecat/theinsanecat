<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Tail - White base with black patch and black tip -->
  <path d="M40 50 C 60 40, 100 50, 110 70" stroke="#FFF" strokeWidth="16" strokeLinecap="round"/>
  <path d="M40 50 C 50 45, 75 48, 85 60" stroke="#000" strokeWidth="16" strokeLinecap="round"/>
  <path d="M30 45 C 40 40, 50 45, 55 55" stroke="#000" strokeWidth="16" strokeLinecap="round"/>
  
  <!-- Back Legs (White Paws with black outlines) -->
  <path d="M100 120 L 60 140 C 50 145, 45 130, 55 125 L 80 110" fill="#FFF" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
  <path d="M110 130 L 70 160 C 60 165, 55 150, 65 145 L 90 120" fill="#FFF" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
  
  <!-- Torso Body Torso -->
  <path d="M110 70 C 140 40, 200 60, 220 100 C 230 130, 180 150, 130 140 C 90 130, 90 90, 110 70 Z" fill="#FFF" stroke="#000" strokeWidth="4"/>
  
  <!-- Black back saddle patch -->
  <path d="M130 70 C 150 55, 180 65, 185 85 C 170 95, 140 90, 130 70 Z" fill="#000" />
  <!-- Black flank patch on hip -->
  <path d="M135 120 C 150 115, 160 130, 150 142 C 135 145, 125 130, 135 120 Z" fill="#000"/>

  <!-- Front Legs (Stretched, White Paws) -->
  <path d="M210 130 L 260 170 C 270 180, 250 190, 240 180 L 190 140" fill="#FFF" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
  <path d="M220 120 L 280 160 C 290 170, 270 180, 260 170 L 200 130" fill="#FFF" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>

  <!-- Head Base -->
  <ellipse cx="210" cy="90" rx="45" ry="40" fill="#FFF" stroke="#000" strokeWidth="4"/>
  
  <!-- Black pirate patch over left eye -->
  <ellipse cx="225" cy="85" rx="14" ry="11" fill="#000" />

  <!-- Ears (Left Black inside, Right Pink inside) -->
  <path d="M175 60 L 185 20 L 210 50" fill="#FFF" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
  <path d="M182 55 L 190 28 L 205 48 Z" fill="#000" />
  <path d="M230 65 L 250 30 L 245 65" fill="#FFF" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
  <path d="M235 60 L 245 40 L 242 60 Z" fill="#FCDBD9" />

  <!-- Face Details (Smiling v-eyes, w-mouth) -->
  <path d="M195 85 Q 200 80 205 85" fill="none" stroke="#000" strokeWidth="3" strokeLinecap="round"/> 
  <path d="M225 85 Q 230 80 235 85" fill="none" stroke="#FFF" strokeWidth="3" strokeLinecap="round"/>
  
  <ellipse cx="190" cy="95" rx="8" ry="4" fill="#FCDBD9" /> 
  <ellipse cx="240" cy="95" rx="8" ry="4" fill="#FCDBD9" opacity="0.6"/> 
  <path d="M210 100 Q 215 105 220 100" fill="none" stroke="#000" strokeWidth="2" strokeLinecap="round"/>
  <polygon points="213,95 217,95 215,98" fill="#000" />
  
  <!-- Whiskers -->
  <path d="M180 85 L 155 80 M 180 95 L 150 95 M 180 105 L 155 110" stroke="#000" strokeWidth="2" strokeLinecap="round"/>
  <path d="M250 85 L 275 80 M 250 95 L 280 95 M 245 105 L 270 110" stroke="#000" strokeWidth="2" strokeLinecap="round"/>
</svg>
