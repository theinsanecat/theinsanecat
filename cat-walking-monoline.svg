<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Tail - White base with black patch and tip, 'S' shape standing up -->
  <path d="M140 130 C 160 110, 175 70, 160 50 C 150 40, 135 60, 140 80 C 145 95, 135 110, 130 115" stroke="#FFF" strokeWidth="6" strokeLinecap="round"/>
  <path d="M145 100 C 150 90, 140 75, 145 65" stroke="#000" strokeWidth="6" strokeLinecap="round"/>
  <path d="M160 50 C 155 40, 145 45, 145 55" fill="#000" />

  <!-- Body Base - Torso -->
  <path d="M50 110 C 40 140, 50 180, 70 185 L 140 185 C 165 175, 160 130, 140 110 Z" fill="#FFF" stroke="#000" strokeWidth="4"/>

  <!-- Black saddle patch on back -->
  <path d="M70 110 C 85 95, 115 100, 120 115 C 105 125, 85 120, 70 110 Z" fill="#000" />
  <!-- Black flank patch on hind leg -->
  <path d="M125 125 C 145 120, 155 145, 140 160 C 125 170, 115 145, 125 125 Z" fill="#000" />

  <!-- 4 Walking Legs (Offset to show walk cycle) -->
  <path d="M132 165 L 140 215 C 135 223, 150 223, 148 215" fill="#FFF" stroke="#000" strokeWidth="3"/>
  <path d="M125 165 L 125 215 C 120 223, 135 223, 133 215" fill="#FFF" stroke="#000" strokeWidth="3"/>
  <path d="M68 165 L 78 210 C 73 218, 88 218, 86 210" fill="#FFF" stroke="#000" strokeWidth="4"/>
  <path d="M82 165 L 72 215 C 67 223, 82 223, 80 215" fill="#FFF" stroke="#000" strokeWidth="4"/>

  <!-- Head Base - Offset to the left/front -->
  <ellipse cx="80" cy="85" rx="45" ry="38" fill="#FFF" stroke="#000" strokeWidth="4"/>
  
  <!-- Black patch over left eye -->
  <ellipse cx="95" cy="81" rx="14" ry="11" fill="#000" />

  <!-- Left Ear (Black inside, white outside) -->
  <path d="M50 60 L 35 30 L 65 50" fill="#FFF" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
  <path d="M45 55 L 38 35 L 56 48 Z" fill="#000" />

  <!-- Right Ear (Pink inside) -->
  <path d="M112 60 L 125 30 L 96 50" fill="#FFF" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
  <path d="M108 55 L 120 36 L 100 48 Z" fill="#FCDBD9" />

  <!-- Face Details -->
  <path d="M62 76 Q 70 68 74 76" fill="none" stroke="#000" strokeWidth="3.5" strokeLinecap="round"/>
  <path d="M84 76 Q 88 68 96 76" fill="none" stroke="#FFF" strokeWidth="3.5" strokeLinecap="round"/>
  
  <ellipse cx="55" cy="88" rx="10" ry="5" fill="#FCDBD9" />
  <ellipse cx="105" cy="88" rx="10" ry="5" fill="#FCDBD9" opacity="0.6"/>

  <path d="M75 92 Q 79 96 83 92" fill="none" stroke="#000" strokeWidth="2.5" strokeLinecap="round"/>
  <polygon points="77,88 81,88 79,92" fill="#000" />

  <!-- Whiskers -->
  <path d="M30 80 L 10 76 M 30 88 L 6 88 M 34 96 L 14 104" stroke="#000" strokeWidth="2" strokeLinecap="round"/>
  <path d="M130 80 L 150 76 M 130 88 L 154 88 M 126 96 L 146 104" stroke="#000" strokeWidth="2" strokeLinecap="round"/>
</svg>
