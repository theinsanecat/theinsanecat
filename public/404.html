<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Soumya Dwivedi Portfolio</title>
    <script type="text/javascript">
      // GitHub Pages SPA 404 Redirect Handler
      // Redirects any unknown URL path (e.g. /theinsanecat/sfk) back to the home page URL
      var l = window.location;
      var pathSegments = l.pathname.split('/');
      // Determine repository base name if hosted on GitHub Pages
      var repoName = (pathSegments.length > 1 && pathSegments[1]) ? '/' + pathSegments[1] + '/' : '/theinsanecat/';
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoName
      );
    </script>
  </head>
  <body>
  </body>
</html>
