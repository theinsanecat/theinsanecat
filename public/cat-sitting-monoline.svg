<svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- Tail - White base with black patch and tip -->
  <path d="M140 180 C 160 180, 180 140, 160 120 C 150 110, 140 130, 145 150" stroke="#FFF" strokeWidth="6" strokeLinecap="round"/>
  <path d="M145 150 C 150 140, 160 125, 160 120" stroke="#000" strokeWidth="6" strokeLinecap="round"/>
  <path d="M160 120 C 155 110, 145 115, 145 125" fill="#000" />

  <!-- Body Base -->
  <path d="M60 100 C 40 150, 40 220, 70 230 L 130 230 C 160 220, 160 150, 140 100 Z" fill="#FFF" stroke="#000" strokeWidth="4"/>

  <!-- Black back saddle patch visible on side -->
  <path d="M50 140 C 40 160, 45 200, 60 200 C 55 170, 52 150, 50 140 Z" fill="#000" />
  <!-- Back Leg Spot (Black) -->
  <path d="M125 140 C 145 135, 155 160, 140 175 C 125 185, 115 160, 125 140 Z" fill="#000" />

  <!-- Front Paws -->
  <path d="M70 170 L 70 230 C 65 240, 85 240, 80 230 L 85 170" fill="#FFF" stroke="#000" strokeWidth="4"/>
  <path d="M120 170 L 120 230 C 115 240, 135 240, 130 230 L 125 170" fill="#FFF" stroke="#000" strokeWidth="4"/>

  <!-- Head Base -->
  <ellipse cx="100" cy="80" rx="55" ry="45" fill="#FFF" stroke="#000" strokeWidth="4"/>
  
  <!-- Black patch over left eye (viewer's right) -->
  <ellipse cx="120" cy="76" rx="16" ry="13" fill="#000" />

  <!-- Left Ear (Black inside, white outside) -->
  <path d="M60 50 L 45 15 L 80 38" fill="#FFF" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
  <path d="M55 45 L 48 20 L 70 36 Z" fill="#000" />

  <!-- Right Ear (Pink inside) -->
  <path d="M140 50 L 155 15 L 120 38" fill="#FFF" stroke="#000" strokeWidth="4" strokeLinejoin="round"/>
  <path d="M135 45 L 150 22 L 125 36 Z" fill="#FCDBD9" />

  <!-- Face Details -->
  <path d="M80 70 Q 90 60 95 70" fill="none" stroke="#000" strokeWidth="4" strokeLinecap="round"/>
  <path d="M105 70 Q 110 60 120 70" fill="none" stroke="#FFF" strokeWidth="4" strokeLinecap="round"/>
  
  <path d="M95 90 Q 100 95 105 90" fill="none" stroke="#000" strokeWidth="3" strokeLinecap="round"/>
  <polygon points="97,85 103,85 100,90" fill="#000" />

  <!-- Whiskers -->
  <path d="M40 75 L 15 70 M 40 85 L 10 85 M 45 95 L 20 105" stroke="#000" strokeWidth="2" strokeLinecap="round"/>
  <path d="M160 75 L 185 70 M 160 85 L 190 85 M 155 95 L 180 105" stroke="#000" strokeWidth="2" strokeLinecap="round"/>
</svg>
